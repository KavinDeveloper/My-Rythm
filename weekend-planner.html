<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b16" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>My Rhythm</title>
  <link rel="icon" href="favicon.svg?v=20261104" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg?v=20261104" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="weekend-planner.css?v=202611041807">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="My Rhythm">
      <span class="brand-dot"></span>
      <span>MY RHYTHM</span>
    </a>
    <div class="week-progress">
      <span id="dayProgressText">0% complete</span>
      <div class="progress-track"><i id="dayProgress"></i></div>
    </div>
  </header>

  <button class="music-toggle" id="musicToggle" type="button" aria-label="Play ambient music" aria-pressed="false">
    <span class="music-bars" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
    <span class="music-label">Play rhythm</span>
  </button>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">CLASS 9 / DAILY <span>RHYTHM</span></p>
        <h1>Rest. Train. Learn.<br><em>Come back stronger.</em></h1>
      </div>

      <div class="day-switcher" role="tablist" aria-label="Choose weekend day">
        <button class="day-tab active" data-day="saturday" role="tab" aria-selected="true">SATURDAY</button>
        <button class="day-tab" data-day="sunday" role="tab" aria-selected="false">SUNDAY</button>
        <button class="day-tab" data-day="weekday" role="tab" aria-selected="false">WEEKDAYS</button>
        <button class="day-tab" data-day="friday" role="tab" aria-selected="false">FRIDAY</button>
        <button class="day-tab" data-day="saturday-school-half" role="tab" aria-selected="false">SATURDAY SCHOOL</button>
        <button class="day-tab" data-day="saturday-school-full" role="tab" aria-selected="false">SATURDAY FULL DAY</button>
      </div>

    </section>

    <section class="schedule-section" id="schedule">
      <div class="schedule-heading">
        <p id="dayLabel">SATURDAY</p>
        <h2>Your time,<br><em>well spent.</em></h2>
      </div>

      <div class="timeline" id="timeline"></div>
    </section>

    <section class="rules-section">
      <p class="eyebrow" id="rulesLabel">WEEKEND <span>RULES</span></p>
      <div class="rules-grid" id="rulesGrid"></div>
    </section>
  </main>

  <script src="weekend-planner.js?v=202611041807"></script>
</body>
</html>
