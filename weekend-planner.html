<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b16" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>My Rhythm</title>
  <link rel="icon" href="favicon.svg?v=202611042030" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg?v=202611042030" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="weekend-planner.css?v=202611051807">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"></div>

  <section class="welcome-screen" id="welcomeScreen" aria-label="Daily welcome">
    <div class="welcome-glow welcome-glow-one"></div>
    <div class="welcome-glow welcome-glow-two"></div>
    <div class="welcome-content">
      <p class="welcome-kicker">YOUR DAILY RHYTHM</p>
      <h1>Welcome,<br><em>Kavin.</em></h1>
      <blockquote>
        <p id="dailyQuote"></p>
        <footer id="dailyQuoteAuthor"></footer>
      </blockquote>
      <button class="welcome-enter" id="welcomeEnter" type="button">
        <span>Enter your rhythm</span>
        <i aria-hidden="true"></i>
      </button>
    </div>
    <p class="welcome-scroll">Scroll to begin</p>
  </section>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="My Rhythm">
      <span class="brand-dot"></span>
      <span>MY RHYTHM</span>
    </a>
    <div class="header-right">
      <div class="week-progress">
        <span id="dayProgressText">0% complete</span>
        <div class="progress-track"><i id="dayProgress"></i></div>
      </div>
      <button class="cloud-sync" id="cloudSync" type="button" aria-label="Sign in to sync My Rhythm">
        <span id="cloudSyncIcon">☁</span>
        <span id="cloudSyncLabel">Sign in to sync</span>
      </button>
    </div>
  </header>

  <button class="music-toggle" id="musicToggle" type="button" aria-label="Play ambient music" aria-pressed="false">
    <span class="music-bars" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
    <span class="music-label">Play rhythm</span>
  </button>
  <button class="music-settings-toggle" id="musicSettingsToggle" type="button" aria-label="Open music settings">♪</button>
  <div class="music-settings" id="musicSettings" aria-hidden="true">
    <div>
      <span>DAILY MELODY</span>
      <strong id="musicMood">Quiet courage</strong>
    </div>
    <label for="musicVolume">Volume</label>
    <input id="musicVolume" type="range" min="0" max="100" value="55">
  </div>

  <button class="focus-toggle" id="focusToggle" type="button" aria-label="Open focus timer">
    <span>FOCUS</span>
    <strong id="focusShortTime">25:00</strong>
  </button>
  <div class="focus-panel" id="focusPanel" aria-hidden="true">
    <p>FOCUS SESSION</p>
    <strong id="focusTime">25:00</strong>
    <div class="focus-actions">
      <button type="button" id="focusStart">Start</button>
      <button type="button" id="focusReset">Reset</button>
    </div>
  </div>

  <button class="rescue-toggle" id="rescueToggle" type="button" aria-label="Open Rescue Plan AI">
    <span class="rescue-icon">✦</span>
    <span>Rescue AI</span>
  </button>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">CLASS 9 / DAILY <span>RHYTHM</span></p>
        <h1>Rest. Train. Learn.<br><em>Come back stronger.</em></h1>
      </div>

      <div class="day-switcher" role="tablist" aria-label="Choose weekend day">
        <button class="day-tab active" data-day="saturday" role="tab" aria-selected="true">SATURDAY</button>
        <button class="day-tab" data-day="sunday" role="tab" aria-selected="false">SUNDAY</button>
        <button class="day-tab" data-day="weekday" role="tab" aria-selected="false">WEEKDAYS</button>
        <button class="day-tab" data-day="friday" role="tab" aria-selected="false">FRIDAY</button>
        <button class="day-tab" data-day="saturday-school-half" role="tab" aria-selected="false">SATURDAY SCHOOL</button>
        <button class="day-tab" data-day="saturday-school-full" role="tab" aria-selected="false">SATURDAY FULL DAY</button>
      </div>

    </section>

    <section class="schedule-section" id="schedule">
      <div class="schedule-heading">
        <p id="dayLabel">SATURDAY</p>
        <h2>Your time,<br><em>well spent.</em></h2>
      </div>

      <div class="timeline" id="timeline"></div>
    </section>

    <section class="rules-section">
      <p class="eyebrow" id="rulesLabel">WEEKEND <span>RULES</span></p>
      <div class="rules-grid" id="rulesGrid"></div>
    </section>
  </main>

  <aside class="rescue-panel" id="rescuePanel" aria-hidden="true" aria-label="Rescue Plan AI">
    <div class="rescue-header">
      <div>
        <p>MY RHYTHM AI</p>
        <h2>Rescue your plan.</h2>
      </div>
      <button id="rescueClose" type="button" aria-label="Close Rescue Plan AI">×</button>
    </div>

    <div class="rescue-body">
      <label for="rescueReason">What changed?</label>
      <textarea id="rescueReason" rows="3" placeholder="Example: Football ended late, I am tired, and homework is pending..."></textarea>

      <div class="rescue-field">
        <label>How much time do you have?</label>
        <div class="rescue-options" id="timeOptions" role="group" aria-label="Available time">
          <button type="button" data-time="15">15 min</button>
          <button type="button" data-time="30">30 min</button>
          <button type="button" data-time="45">45 min</button>
          <button type="button" data-time="60" class="active">1 hour</button>
          <button type="button" data-time="90">90 min</button>
          <button type="button" data-time="120">2 hours</button>
          <button type="button" data-time="180">3 hours</button>
          <button type="button" data-time="240">4 hours</button>
          <button type="button" data-time="360">6 hours</button>
          <button type="button" data-time="480">All evening</button>
        </div>
      </div>

      <div class="rescue-field">
        <label>Are Vedantu classes running?</label>
        <div class="rescue-options" id="classStatusOptions" role="group" aria-label="Vedantu class status">
          <button type="button" data-status="normal" class="active">Classes normal</button>
          <button type="button" data-status="canceled">Class canceled</button>
          <button type="button" data-status="leave">Holiday / class leave</button>
        </div>
      </div>

      <div class="rescue-field">
        <label>What matters most now?</label>
        <div class="rescue-options priority-options" id="priorityOptions" role="group" aria-label="Priority">
          <button type="button" data-priority="school" class="active">School work</button>
          <button type="button" data-priority="jee">JEE</button>
          <button type="button" data-priority="revision">Revision</button>
          <button type="button" data-priority="extra">Use extra time</button>
          <button type="button" data-priority="health">Health & rest</button>
          <button type="button" data-priority="chores">Chores</button>
        </div>
      </div>

      <button class="rescue-create" id="rescueCreate" type="button">Create my rescue plan <span>→</span></button>

      <div class="rescue-result" id="rescueResult" aria-live="polite"></div>
    </div>
  </aside>
  <div class="rescue-backdrop" id="rescueBackdrop"></div>

  <script src="weekend-planner.js?v=202611051807"></script>
  <script type="module" src="firebase-sync.js?v=202611051807"></script>
</body>
</html>
